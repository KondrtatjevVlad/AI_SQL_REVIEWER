services:
  db:
    image: postgres:16-alpine
    container_name: ai_sql_postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_sql_reviewer}
      POSTGRES_USER: ${POSTGRES_USER:-ai_reviewer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_reviewer_dev_password}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ai_reviewer} -d ${POSTGRES_DB:-ai_sql_reviewer}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai_sql_app

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-ai_reviewer}:${POSTGRES_PASSWORD:-ai_reviewer_dev_password}@db:5432/${POSTGRES_DB:-ai_sql_reviewer}"

      OLLAMA_HOST: "http://host.docker.internal:11434"

    ports:
      - "8501:8501"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped


volumes:
  postgres_data: